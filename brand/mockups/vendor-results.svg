<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
      .h{fill:#F0F6FC;font-weight:800;} .m{fill:#8B949E;} .w{fill:#F0F6FC;}
      .ac{fill:#00C9A7;} .lbl{fill:#8B949E;font-size:12px;font-weight:700;letter-spacing:2px;}
    </style>
  </defs>
  <rect width="1000" height="1000" fill="#05070A"/>
  <rect x="285" y="55" width="430" height="890" rx="46" fill="#0D1117" stroke="#20262E" stroke-width="2"/>
  <rect x="470" y="72" width="60" height="10" rx="5" fill="#000"/>

  <!-- header -->
  <text x="322" y="120" class="w" font-size="22">‹</text>
  <text x="500" y="118" text-anchor="middle" class="h" font-size="17">Cabin &amp; Interior</text>
  <circle cx="648" cy="113" r="7" fill="none" stroke="#F0F6FC" stroke-width="2"/><line x1="653" y1="118" x2="659" y2="124" stroke="#F0F6FC" stroke-width="2"/>
  <path d="M676 108 h18 M679 115 h12 M682 122 h6" stroke="#F0F6FC" stroke-width="2" fill="none"/>

  <!-- segmented -->
  <rect x="305" y="146" width="390" height="42" rx="12" fill="#161B22" stroke="#1E2630"/>
  <rect x="309" y="150" width="191" height="34" rx="9" fill="#00C9A7"/>
  <text x="404" y="172" text-anchor="middle" font-size="14" font-weight="800" fill="#04110E">Vendors</text>
  <text x="596" y="172" text-anchor="middle" class="m" font-size="14" font-weight="700">Products</text>

  <!-- sort row -->
  <text x="305" y="220" class="w" font-size="13" font-weight="600">Sort: <tspan class="ac">Popular ▾</tspan></text>
  <rect x="560" y="204" width="118" height="28" rx="14" fill="#0D2B27" stroke="#00C9A7"/><circle cx="577" cy="218" r="5" fill="#00C9A7"/><text x="588" y="222" class="ac" font-size="11" font-weight="700">Fits my car</text>

  <!-- list rows -->
  <g>
    <!-- row template -->
    <g>
      <circle cx="326" cy="266" r="18" fill="#232B36"/>
      <text x="356" y="262" class="h" font-size="15">Bride</text><text x="356" y="280" class="m" font-size="11.5">Zeta IV, Gias III · 3 fit your car</text>
      <text x="676" y="272" class="m" font-size="16">›</text>
      <line x1="356" y1="300" x2="690" y2="300" stroke="#1E2630"/>
    </g>
    <g>
      <circle cx="326" cy="336" r="18" fill="#232B36"/>
      <text x="356" y="332" class="h" font-size="15">Cusco</text><text x="356" y="350" class="m" font-size="11.5">Sway bars, strut braces</text>
      <text x="676" y="342" class="m" font-size="16">›</text>
      <line x1="356" y1="370" x2="690" y2="370" stroke="#1E2630"/>
    </g>
    <g>
      <circle cx="326" cy="406" r="18" fill="#2A3340"/>
      <text x="356" y="402" class="h" font-size="15">Recaro</text><text x="356" y="420" class="m" font-size="11.5">Sportster CS, Ergomed · 2 fit</text>
      <text x="676" y="412" class="m" font-size="16">›</text>
      <line x1="356" y1="440" x2="690" y2="440" stroke="#1E2630"/>
    </g>
    <g>
      <circle cx="326" cy="476" r="18" fill="#232B36"/>
      <text x="356" y="472" class="h" font-size="15">Sparco</text><text x="356" y="490" class="m" font-size="11.5">Harnesses, wheels, seats</text>
      <text x="676" y="482" class="m" font-size="16">›</text>
    </g>
  </g>

  <!-- A-Z rail -->
  <g fill="#8B949E" font-size="9" text-anchor="middle">
    <text x="700" y="262" class="ac" font-weight="800">B</text>
    <text x="700" y="278">C</text><text x="700" y="294">D</text><text x="700" y="310">F</text><text x="700" y="326">H</text>
    <text x="700" y="342">K</text><text x="700" y="358">M</text><text x="700" y="374">R</text><text x="700" y="390">S</text><text x="700" y="406">T</text>
    <text x="700" y="422">V</text><text x="700" y="438">W</text>
  </g>

  <!-- dim + quick-look sheet -->
  <rect x="287" y="520" width="426" height="358" fill="#000" opacity="0.5"/>
  <rect x="287" y="560" width="426" height="318" rx="24" fill="#0D1117" stroke="#1E2630"/>
  <rect x="480" y="576" width="40" height="5" rx="2.5" fill="#3A424C"/>

  <text x="500" y="602" text-anchor="middle" class="m" font-size="11" font-weight="700" letter-spacing="2">QUICK LOOK</text>
  <rect x="311" y="618" width="120" height="120" rx="12" fill="#232B36"/>
  <text x="447" y="642" class="h" font-size="17">Recaro Sportster CS</text>
  <text x="447" y="664" class="m" font-size="12.5">Recaro · Interior</text>
  <text x="447" y="694" class="ac" font-size="20" font-weight="800">$1,695</text>
  <circle cx="454" cy="716" r="7" fill="#00C9A7"/><path d="M451 716 l2 2 4 -4" stroke="#04110E" stroke-width="2" fill="none"/>
  <text x="468" y="721" class="ac" font-size="12.5" font-weight="700">Fits your 2019 WRX STI</text>

  <text x="311" y="770" class="m" font-size="12">Fibre-reinforced polymer shell. Optional heating &amp; side airbag modules.</text>

  <rect x="311" y="792" width="250" height="46" rx="12" fill="#00C9A7"/><text x="436" y="820" text-anchor="middle" font-size="14.5" font-weight="800" fill="#04110E">Add to my build</text>
  <rect x="571" y="792" width="118" height="46" rx="12" fill="#161B22" stroke="#00C9A7"/><text x="630" y="820" text-anchor="middle" class="ac" font-size="13.5" font-weight="700">Website</text>

  <!-- caption -->
  <text x="500" y="978" text-anchor="middle" class="m" font-size="15" font-weight="700">Screen 2 — Results (Vendors ⇄ Products) + Quick-Look sheet</text>
</svg>
