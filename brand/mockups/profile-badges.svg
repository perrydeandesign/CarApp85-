<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ban" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243040"/><stop offset="1" stop-color="#0F141B"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E5A300"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8EDF2"/><stop offset="1" stop-color="#9AA6B2"/></linearGradient>
    <style>
      text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
      .h{fill:#F0F6FC;font-weight:800;} .m{fill:#8B949E;} .w{fill:#F0F6FC;}
      .ac{fill:#00C9A7;} .lbl{fill:#8B949E;font-size:12px;font-weight:700;letter-spacing:2px;}
    </style>
  </defs>
  <rect width="1000" height="1000" fill="#05070A"/>
  <rect x="285" y="55" width="430" height="890" rx="46" fill="#0D1117" stroke="#20262E" stroke-width="2"/>
  <rect x="470" y="72" width="60" height="10" rx="5" fill="#000"/>

  <!-- header over banner -->
  <clipPath id="pc"><rect x="287" y="57" width="426" height="886" rx="44"/></clipPath>
  <g clip-path="url(#pc)">
    <rect x="287" y="95" width="426" height="175" fill="url(#ban)"/>
  </g>
  <text x="322" y="120" class="w" font-size="22">‹</text>
  <path d="M672 108 v16 M666 114 l6 -6 6 6" stroke="#F0F6FC" stroke-width="2" fill="none"/>

  <!-- avatar with GOLD champion ring + trophy pip -->
  <circle cx="360" cy="262" r="52" fill="#0D1117"/>
  <circle cx="360" cy="262" r="50" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <circle cx="360" cy="262" r="43" fill="#2A3340"/>
  <circle cx="360" cy="262" r="43" fill="#33404F"/>
  <!-- trophy pip -->
  <circle cx="393" cy="295" r="17" fill="url(#gold)" stroke="#0D1117" stroke-width="3"/>
  <path d="M386 288 h14 v4 a7 7 0 0 1 -14 0 z M389 299 h8 v3 h-8 z M391 302 h4 v3 h-4 z" fill="#3A2A00"/>

  <!-- name + trophy count -->
  <text x="316" y="345" class="h" font-size="24">jake_sti</text>
  <rect x="440" y="326" width="58" height="26" rx="13" fill="#2B2000" stroke="#E5A300"/>
  <path d="M451 334 h9 v3 a4.5 4.5 0 0 1 -9 0 z M454 341 h3 v3 h-3 z" fill="#FBBF24"/>
  <text x="468" y="344" fill="#FBBF24" font-size="13" font-weight="800">3</text>
  <text x="316" y="370" class="m" font-size="13.5">2019 Subaru WRX STI · Melbourne</text>

  <!-- stats -->
  <g text-anchor="middle">
    <text x="370" y="410" class="h" font-size="18">14</text><text x="370" y="428" class="m" font-size="11">POSTS</text>
    <text x="500" y="410" class="h" font-size="18">97</text><text x="500" y="428" class="m" font-size="11">FOLLOWERS</text>
    <text x="630" y="410" class="h" font-size="18">428</text><text x="630" y="428" class="m" font-size="11">FOLLOWING</text>
  </g>

  <!-- ACHIEVEMENTS strip -->
  <text x="316" y="468" class="lbl">ACHIEVEMENTS</text>
  <text x="694" y="468" text-anchor="end" class="ac" font-size="11" font-weight="700">See all ›</text>

  <!-- gold pill -->
  <rect x="311" y="480" width="182" height="86" rx="14" fill="#161B22" stroke="#E5A300"/>
  <circle cx="343" cy="512" r="16" fill="url(#gold)"/><path d="M336 505 h14 v4 a7 7 0 0 1 -14 0 z M339 516 h8 v3 h-8 z" fill="#3A2A00"/>
  <text x="368" y="508" class="h" font-size="14">Rolling Shots</text>
  <text x="368" y="526" fill="#FBBF24" font-size="11.5" font-weight="700">1st place · Winner</text>
  <text x="327" y="552" class="m" font-size="11">Jun 2026 · Photo Challenge</text>

  <!-- silver pill -->
  <rect x="503" y="480" width="182" height="86" rx="14" fill="#161B22" stroke="#1E2630"/>
  <circle cx="535" cy="512" r="16" fill="url(#silver)"/><path d="M528 505 h14 v4 a7 7 0 0 1 -14 0 z M531 516 h8 v3 h-8 z" fill="#2A2F35"/>
  <text x="560" y="508" class="h" font-size="14">JDM Only</text>
  <text x="560" y="526" fill="#C9D1D9" font-size="11.5" font-weight="700">Finalist · Top 3</text>
  <text x="519" y="552" class="m" font-size="11">May 2026 · Photo Challenge</text>

  <rect x="695" y="480" width="30" height="86" rx="14" fill="#161B22" stroke="#1E2630" opacity="0.5"/>

  <!-- edit profile -->
  <rect x="311" y="584" width="378" height="44" rx="12" fill="#161B22" stroke="#1E2630"/>
  <text x="500" y="611" text-anchor="middle" class="w" font-size="14" font-weight="700">Edit Profile</text>

  <!-- tabs -->
  <line x1="305" y1="654" x2="695" y2="654" stroke="#1E2630"/>
  <g fill="none" stroke="#00C9A7" stroke-width="2.5"><rect x="345" y="672" width="10" height="10"/><rect x="359" y="672" width="10" height="10"/><rect x="345" y="686" width="10" height="10"/><rect x="359" y="686" width="10" height="10"/></g>
  <g fill="none" stroke="#8B949E" stroke-width="2"><rect x="432" y="672" width="24" height="20" rx="3"/><circle cx="444" cy="682" r="4"/></g>
  <g fill="none" stroke="#8B949E" stroke-width="2"><circle cx="540" cy="682" r="10"/><path d="M536 682 l4 3 4 -6"/></g>
  <g fill="none" stroke="#8B949E" stroke-width="2"><path d="M628 690 v-12 h20 v12 M632 678 v-4 h12 v4"/></g>

  <!-- grid hint -->
  <g fill="#1a1f27"><rect x="311" y="712" width="120" height="120"/><rect x="440" y="712" width="120" height="120"/><rect x="569" y="712" width="120" height="120"/></g>

  <!-- annotation legend -->
  <text x="500" y="900" text-anchor="middle" class="m" font-size="12.5">Ring &amp; pip = current champion · Gold 1st · Silver finalist · Teal entrant</text>
  <text x="500" y="978" text-anchor="middle" class="m" font-size="15" font-weight="700">Task 2 — Winner badge: champion ring + achievements strip</text>
</svg>
